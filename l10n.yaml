# Config for `flutter gen-l10n`, which turns the .arb files into Dart code.
# The filename must be exactly `l10n.yaml` — Flutter does not look for anything else.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# Makes AppLocalizations.of(context) return a non-nullable value, so screens can
# write `AppLocalizations.of(context).logIn` instead of `...of(context)!.logIn`.
nullable-getter: false
